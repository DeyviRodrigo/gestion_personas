# Entorno local de desarrollo. El esquema gestion_personas lo administra Flyway.
project_id = "gestion-personas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = false

[db.seed]
enabled = false

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:54323"
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[realtime]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
