spring.main.web-application-type=none
spring.main.banner-mode=off
spring.config.import=optional:file:${user.home}/.gestion-personas/database.properties

# Supabase local. Configuración generada por scripts/supabase.ps1 setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres?currentSchema=gestion_personas}
spring.datasource.username=${DB_USER:gestion_personas_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.connectTimeout=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=gestion_personas
spring.sql.init.mode=never

# Flyway es el único responsable del esquema de esta aplicación.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=gestion_personas
spring.flyway.schemas=gestion_personas
spring.flyway.user=${FLYWAY_USER:postgres}
spring.flyway.password=${FLYWAY_PASSWORD:postgres}
spring.flyway.clean-disabled=true

app.audit-user=${APP_AUDIT_USER:${user.name:local}}
logging.level.root=WARN
logging.level.com.example.crudpersona=INFO
