# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:${user.home}/.gestion-personas/persona.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# SQLite no admite agregar restricciones UNIQUE con ALTER TABLE.
# El índice se crea después de que Hibernate haya creado/actualizado la tabla.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Registro de actividad
logging.level.root=WARN
logging.level.com.example.crudpersona=INFO
logging.level.org.hibernate.SQL=DEBUG
