spring.main.web-application-type=none
spring.main.banner-mode=off
# La configuración de PostgreSQL de la versión 2.0 ya no se carga.
spring.config.import=optional:file:${user.home}/.gestion-personas/sqlite.properties

spring.datasource.url=${SQLITE_URL:jdbc:sqlite:${user.home}/.gestion-personas/persona.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

app.audit-user=${APP_AUDIT_USER:${user.name:local}}
logging.level.root=WARN
logging.level.com.example.crudpersona=INFO
